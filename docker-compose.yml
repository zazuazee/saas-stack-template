services:
  postgres:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-saas-postgres}
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-saasdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: